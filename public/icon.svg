<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian night gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121c" />
      <stop offset="45%" stop-color="#0e1d2c" />
      <stop offset="100%" stop-color="#05080d" />
    </linearGradient>

    <!-- Luxury Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Soft Golden Glow -->
    <radialGradient id="skyAura" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a121c" stop-opacity="0" />
    </radialGradient>

    <!-- Mosque interior amber light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Mosque structure gradient -->
    <linearGradient id="mosqueBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152638" />
      <stop offset="50%" stop-color="#0f1b27" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle inner golden border ring -->
  <rect width="496" height="496" x="8" y="8" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  <rect width="484" height="484" x="14" y="14" rx="102" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" />

  <!-- Ambient celestial sky aura -->
  <rect width="512" height="512" rx="116" fill="url(#skyAura)" />

  <!-- Islamic Geometric Rosette background (subtle watermark) -->
  <g opacity="0.08" stroke="#fbbf24" stroke-width="1.5" fill="none">
    <circle cx="256" cy="220" r="160" />
    <circle cx="256" cy="220" r="120" stroke-dasharray="4,4" />
    <polygon points="256,60 369,173 369,333 256,446 143,333 143,173" />
    <polygon points="369,220 256,107 143,220 256,333" />
  </g>

  <!-- Twinkling stars in sky -->
  <g fill="#fef08a" opacity="0.75">
    <circle cx="110" cy="115" r="2.5" />
    <circle cx="140" cy="80" r="1.5" />
    <circle cx="370" cy="100" r="2.5" />
    <circle cx="410" cy="130" r="1.5" />
    <circle cx="85" cy="170" r="2" />
    <circle cx="430" cy="180" r="2" />
    <circle cx="200" cy="70" r="1.5" />
    <circle cx="310" cy="65" r="1.5" />
  </g>

  <!-- ================= CRESCENT & STAR ================= -->
  <!-- Glowing Crescent Moon -->
  <g filter="url(#goldGlow)">
    <path d="M 235,65 A 64,64 0 1 0 315,178 A 76,76 0 1 1 235,65 Z" fill="url(#goldGrad)" />
    <!-- 8-Pointed Islamic Star next to crescent -->
    <path d="M 315,108 L 320,119 L 332,120 L 322,127 L 325,138 L 315,131 L 305,138 L 308,127 L 298,120 L 310,119 Z" fill="url(#goldGrad)" />
  </g>

  <!-- ================= GRAND MOSQUE SILHOUETTE ================= -->

  <!-- Left Minaret -->
  <g>
    <!-- Base & Tower Shaft -->
    <path d="M 92,430 L 98,200 L 118,200 L 124,430 Z" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Balcony 1 (Şerefe) -->
    <rect x="94" y="270" width="28" height="10" rx="3" fill="url(#goldGrad)" />
    <rect x="96" y="273" width="24" height="2" fill="#091017" />
    <!-- Balcony 2 -->
    <rect x="96" y="200" width="24" height="9" rx="3" fill="url(#goldGrad)" />
    <!-- Minaret Cone (Külah) -->
    <polygon points="108,135 99,200 117,200" fill="url(#goldGrad)" />
    <!-- Minaret Spire & Crescent Finial -->
    <line x1="108" y1="135" x2="108" y2="115" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="108" cy="112" r="3" fill="url(#goldGrad)" />
    <!-- Slit Windows -->
    <rect x="106" y="320" width="4" height="12" rx="2" fill="url(#windowLight)" opacity="0.9" />
    <rect x="106" y="360" width="4" height="12" rx="2" fill="url(#windowLight)" opacity="0.9" />
  </g>

  <!-- Right Minaret -->
  <g>
    <!-- Base & Tower Shaft -->
    <path d="M 388,430 L 394,200 L 414,200 L 420,430 Z" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Balcony 1 (Şerefe) -->
    <rect x="390" y="270" width="28" height="10" rx="3" fill="url(#goldGrad)" />
    <rect x="392" y="273" width="24" height="2" fill="#091017" />
    <!-- Balcony 2 -->
    <rect x="392" y="200" width="24" height="9" rx="3" fill="url(#goldGrad)" />
    <!-- Minaret Cone (Külah) -->
    <polygon points="404,135 395,200 413,200" fill="url(#goldGrad)" />
    <!-- Minaret Spire & Crescent Finial -->
    <line x1="404" y1="135" x2="404" y2="115" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="404" cy="112" r="3" fill="url(#goldGrad)" />
    <!-- Slit Windows -->
    <rect x="402" y="320" width="4" height="12" rx="2" fill="url(#windowLight)" opacity="0.9" />
    <rect x="402" y="360" width="4" height="12" rx="2" fill="url(#windowLight)" opacity="0.9" />
  </g>

  <!-- Side Semi-Domes -->
  <!-- Left Semi-Dome -->
  <path d="M 124,380 C 124,290 190,285 200,380 Z" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="162" cy="285" r="4" fill="url(#goldGrad)" />

  <!-- Right Semi-Dome -->
  <path d="M 312,380 C 322,285 388,290 388,380 Z" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="350" cy="285" r="4" fill="url(#goldGrad)" />

  <!-- Central Mosque Main Body Base Wall -->
  <rect x="120" y="360" width="272" height="75" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Majestic Grand Central Dome -->
  <path d="M 180,360 C 180,210 240,195 256,190 C 272,195 332,210 332,360 Z" fill="url(#mosqueBase)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Dome Rib lines (Classic Ottoman Architecture) -->
  <path d="M 215,360 C 218,270 245,210 256,190 C 267,210 294,270 297,360" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="256" y1="190" x2="256" y2="360" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Grand Dome Finial (Alem) -->
  <g filter="url(#goldGlow)">
    <line x1="256" y1="190" x2="256" y2="160" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="256" cy="172" r="5" fill="url(#goldGrad)" />
    <!-- Miniature Crescent atop Alem -->
    <path d="M 252,150 A 9,9 0 1 0 262,165 A 11,11 0 1 1 252,150 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Dome Base Drum & Arched Windows -->
  <rect x="180" y="348" width="152" height="14" rx="2" fill="url(#goldGrad)" />
  <g fill="#fef08a">
    <path d="M 198,348 A 6,6 0 0 1 210,348 Z" />
    <path d="M 222,348 A 6,6 0 0 1 234,348 Z" />
    <path d="M 246,348 A 6,6 0 0 1 258,348 Z" />
    <path d="M 270,348 A 6,6 0 0 1 282,348 Z" />
    <path d="M 294,348 A 6,6 0 0 1 306,348 Z" />
  </g>

  <!-- Grand Arched Portal / Entrance (Mihrab Glow) -->
  <path d="M 230,435 L 230,378 C 230,364 256,354 256,354 C 256,354 282,364 282,378 L 282,435 Z" fill="#06090e" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Radiant Light pouring out of mosque door -->
  <path d="M 236,435 L 236,384 C 236,374 256,366 256,366 C 256,366 276,374 276,384 L 276,435 Z" fill="url(#windowLight)" filter="url(#goldGlow)" opacity="0.9" />

  <!-- Side Windows with Golden Glow -->
  <g fill="url(#windowLight)">
    <!-- Left Windows -->
    <path d="M 145,405 L 145,385 C 145,378 157,374 157,374 C 157,374 169,378 169,385 L 169,405 Z" opacity="0.85" />
    <path d="M 190,405 L 190,385 C 190,378 202,374 202,374 C 202,374 214,378 214,385 L 214,405 Z" opacity="0.85" />
    <!-- Right Windows -->
    <path d="M 298,405 L 298,385 C 298,378 310,374 310,374 C 310,374 322,378 322,385 L 322,405 Z" opacity="0.85" />
    <path d="M 343,405 L 343,385 C 343,378 355,374 355,374 C 355,374 367,378 367,385 L 367,405 Z" opacity="0.85" />
  </g>

  <!-- Base Courtyard Steps -->
  <path d="M 70,435 L 442,435" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 85,445 L 427,445" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 100,454 L 412,454" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4" />
</svg>
